<title>Tu Arco Saiyajin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: escenario SVG (páramo al atardecer) a la izquierda, panel de historia a la derecha; en móvil, texto debajo. Un solo look: atardecer de páramo. */
:root {
  color-scheme: dark;
  --ground: #1a1220;
  --panel: #261a2c;
  --line: #3d2c44;
  --ink: #fff4e6;
  --muted: #c9b3bd;
  --ki: #ffb43a;
  --beam: #6fd8ff;
  --danger: #ff4d5e;
  --scouter: #5cff9d;
  --f-display: "Bangers", "Impact", "Arial Black", sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
.app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; gap: 20px; box-sizing: border-box;
}
.stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; }
.stage svg { width: 100%; height: 100%; max-height: 100%; border-radius: 18px; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; justify-content: center; }
.eyebrow { font-family: var(--f-mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ki); }
h1 { font-family: var(--f-display); font-weight: 400; letter-spacing: .03em; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; margin: 0; text-wrap: balance; }
.body { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 60ch; }
.body b { color: var(--ink); }
.readout { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 88px; }
.chip span { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chip strong { font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--scouter); }
.chip.hot strong { color: var(--danger); }
.vote { display: grid; gap: 10px; }
.vote button { text-align: left; border-radius: 14px; padding: 12px 14px; font: 800 15px var(--f-body); }
.vote button small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 2px; }
.vote button[aria-pressed="true"] { border-color: var(--ki); background: #3a2420; }
.voted { font-size: 14px; color: var(--ki); margin: 0; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
button {
  font: 700 14px var(--f-body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--ki); outline-offset: 2px; }
button.primary { background: var(--ki); color: var(--ground); border-color: var(--ki); }
.dots { display: flex; gap: 8px; margin-left: auto; }
.dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; background: var(--line); border: 0; }
.dots button[aria-current="true"] { background: var(--ki); }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar div { height: 100%; width: 0; background: var(--ki); }
svg text { font-family: var(--f-body); }
svg .big { font-family: var(--f-display); letter-spacing: 1px; }
svg .mono { font-family: var(--f-mono); }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(240px, 46vh) auto; height: auto; min-height: 100%; }
  .side { justify-content: flex-start; }
  h1 { font-size: 32px; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <svg viewBox="0 0 800 480" role="img" aria-labelledby="title">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b1840"/><stop offset=".55" stop-color="#b8475a"/><stop offset="1" stop-color="#f5a04a"/>
        </linearGradient>
        <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9a5a36"/><stop offset="1" stop-color="#4a2a22"/>
        </linearGradient>
        <radialGradient id="aura"><stop offset="0" stop-color="#ffe27a" stop-opacity=".85"/><stop offset="1" stop-color="#ffb43a" stop-opacity="0"/></radialGradient>
        <radialGradient id="redGlow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".9"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
        <clipPath id="frame"><rect width="800" height="480" rx="18"/></clipPath>
      </defs>
      <g clip-path="url(#frame)">
      <g id="world">
        <rect x="-40" y="-40" width="880" height="560" fill="url(#sky)"/>
        <circle cx="620" cy="300" r="70" fill="#ffd27a" opacity=".55"/>
        <g id="stars"></g>
        <!-- mesetas del páramo -->
        <path d="M -20 360 L 40 360 L 60 230 L 150 222 L 170 360 L 260 360 L 280 290 L 340 285 L 355 360 L 820 360 L 820 480 L -20 480 Z" fill="#6b3a3a" opacity=".75"/>
        <path d="M 470 360 L 500 180 L 560 172 L 585 360 Z M 660 360 L 690 260 L 760 255 L 790 360 Z" fill="#7d4338" opacity=".85"/>
        <rect x="-40" y="355" width="880" height="170" fill="url(#dirt)"/>
        <g id="rocks"></g>
        <!-- cráter -->
        <g id="crater" opacity="0">
          <ellipse cx="560" cy="392" rx="95" ry="20" fill="#2e1a18"/>
          <ellipse cx="560" cy="386" rx="98" ry="12" fill="none" stroke="#b77048" stroke-width="5"/>
          <g id="pod">
            <circle cx="560" cy="372" r="30" fill="#e8e3ee" stroke="#6d6577" stroke-width="3"/>
            <path d="M 538 366 a 24 18 0 0 1 44 0 z" fill="#b2324b"/>
            <circle id="podEyeL" cx="552" cy="364" r="3" fill="#ff4d5e" opacity="0"/>
            <circle id="podEyeR" cx="568" cy="364" r="3" fill="#ff4d5e" opacity="0"/>
          </g>
          <circle id="podGlow" cx="560" cy="366" r="70" fill="url(#redGlow)" opacity="0"/>
        </g>
        <!-- estela de la caída -->
        <g id="meteor" opacity="0">
          <line id="trail" stroke="#ffe0b0" stroke-width="10" stroke-linecap="round" opacity=".7"/>
          <circle id="head" r="16" fill="#fff4d6"/>
        </g>
        <g id="dust"></g>

        <!-- TÚ -->
        <g id="you">
          <g id="youBody">
            <rect x="-13" y="-34" width="10" height="34" rx="4" fill="#3c4a6b"/>
            <rect x="3" y="-34" width="10" height="34" rx="4" fill="#3c4a6b"/>
            <rect x="-18" y="-68" width="36" height="38" rx="9" fill="#e9e4dc"/>
            <rect x="-26" y="-64" width="9" height="28" rx="4" fill="#f1c9a0"/>
            <rect x="17" y="-64" width="9" height="28" rx="4" fill="#f1c9a0"/>
            <circle cx="0" cy="-90" r="22" fill="#f1c9a0"/>
            <path d="M -22 -94 Q -20 -116 0 -114 Q 22 -116 22 -94 Q 10 -104 -22 -94 Z" fill="#5a3a24"/>
            <g id="youEyes"><circle cx="-8" cy="-89" r="2.6" fill="#1a1220"/><circle cx="8" cy="-89" r="2.6" fill="#1a1220"/></g>
            <path id="youMouth" d="M -5 -79 Q 0 -76 5 -79" stroke="#1a1220" stroke-width="2" fill="none" stroke-linecap="round"/>
            <g id="scouter" opacity="0">
              <rect x="10" y="-100" width="18" height="14" rx="3" fill="#5cff9d" opacity=".55"/>
              <rect x="18" y="-102" width="6" height="22" rx="2" fill="#2a3a30"/>
            </g>
          </g>
          <text id="youLabel" x="0" y="26" text-anchor="middle" fill="#fff4e6" font-weight="800" font-size="14">TÚ</text>
        </g>

        <!-- GOKU -->
        <g id="goku" opacity="0">
          <ellipse id="gAura" cx="0" cy="-60" rx="62" ry="92" fill="url(#aura)"/>
          <g id="cloud">
            <ellipse cx="0" cy="8" rx="50" ry="13" fill="#ffd94a"/>
            <ellipse cx="-26" cy="2" rx="20" ry="12" fill="#ffe57d"/>
            <ellipse cx="18" cy="0" rx="22" ry="13" fill="#ffe57d"/>
            <ellipse cx="54" cy="10" rx="14" ry="6" fill="#ffd94a"/>
          </g>
          <rect x="-14" y="-34" width="12" height="34" rx="4" fill="#f07a1a"/>
          <rect x="2" y="-34" width="12" height="34" rx="4" fill="#f07a1a"/>
          <rect x="-16" y="-8" width="14" height="9" rx="3" fill="#24408e"/>
          <rect x="2" y="-8" width="14" height="9" rx="3" fill="#24408e"/>
          <rect x="-20" y="-70" width="40" height="40" rx="9" fill="#f07a1a"/>
          <path d="M -9 -70 L 0 -54 L 9 -70 Z" fill="#24408e"/>
          <rect x="-20" y="-38" width="40" height="7" fill="#24408e"/>
          <g id="gArmL"><rect x="-30" y="-66" width="10" height="28" rx="4" fill="#f1c9a0"/><rect x="-31" y="-44" width="12" height="8" rx="2" fill="#24408e"/></g>
          <g id="gArmR"><rect x="20" y="-66" width="10" height="28" rx="4" fill="#f1c9a0"/><rect x="19" y="-44" width="12" height="8" rx="2" fill="#24408e"/></g>
          <circle cx="0" cy="-92" r="22" fill="#f1c9a0"/>
          <path d="M -24 -92 L -40 -104 L -26 -110 L -38 -128 L -16 -120 L -14 -142 L 0 -122 L 10 -144 L 16 -120 L 36 -130 L 26 -110 L 42 -102 L 24 -94 Q 14 -108 2 -100 Q -4 -110 -12 -100 Q -18 -106 -24 -92 Z" fill="#14101a"/>
          <circle cx="-8" cy="-89" r="2.8" fill="#14101a"/><circle cx="8" cy="-89" r="2.8" fill="#14101a"/>
          <path d="M -6 -79 Q 0 -73 6 -79" stroke="#14101a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <text id="gLabel" x="0" y="34" text-anchor="middle" fill="#fff4e6" font-weight="800" font-size="14">GOKU</text>
        </g>

        <!-- bocadillo -->
        <g id="bubble" opacity="0">
          <rect id="bubbleBox" x="0" y="0" width="250" height="56" rx="14" fill="#fff4e6"/>
          <text id="bubbleText" x="14" y="23" fill="#1a1220" font-weight="800" font-size="15"></text>
          <text id="bubbleText2" x="14" y="43" fill="#1a1220" font-weight="700" font-size="14"></text>
        </g>
      </g>

      <!-- capa fija: rótulos -->
      <g id="tag">
        <rect x="350" y="26" width="100" height="26" rx="8" fill="#ff4d5e"/>
        <text id="tagText" x="400" y="45" text-anchor="middle" fill="#fff4e6" font-weight="800" font-size="14">DÍA 1</text>
      </g>
      <g id="headline">
        <text id="hl1" x="400" y="110" text-anchor="middle" class="big" font-size="64" fill="#ffd94a" stroke="#1a1220" stroke-width="3" paint-order="stroke">MUNDO DRAGON BALL</text>
        <text id="hl2" x="400" y="146" text-anchor="middle" class="big" font-size="30" fill="#fff4e6" stroke="#1a1220" stroke-width="2" paint-order="stroke">DESPERTASTE DENTRO. SIN NADA.</text>
      </g>
      <g id="scouterHud" opacity="0">
        <rect x="560" y="70" width="210" height="82" rx="8" fill="#0d2a1a" opacity=".85" stroke="#5cff9d"/>
        <text x="574" y="94" class="mono" fill="#5cff9d" font-size="14">PODER DE PELEA</text>
        <text id="hudNum" x="574" y="134" class="mono" fill="#5cff9d" font-size="36">0</text>
      </g>
      <g id="timerHud" opacity="0">
        <rect x="320" y="70" width="160" height="62" rx="10" fill="#140a0e" stroke="#ff4d5e" stroke-width="2"/>
        <text id="clock" x="400" y="116" text-anchor="middle" class="mono" fill="#ff4d5e" font-size="44">0:23</text>
      </g>
      </g>
    </svg>
  </div>

  <aside class="side" aria-live="polite">
    <div class="eyebrow" id="eyebrow">Parte 1 · Escena 1 de 5</div>
    <h1 id="title">Despiertas</h1>
    <p class="body" id="text"></p>
    <div class="readout" id="readout">
      <div class="chip"><span>Tu poder</span><strong id="myPow">5</strong></div>
      <div class="chip"><span>Objetos</span><strong id="items">0</strong></div>
      <div class="chip" id="otherChip" hidden><span id="otherLbl">Lectura</span><strong id="otherPow">0</strong></div>
    </div>
    <div class="vote" id="vote" hidden>
      <button type="button" id="optA" aria-pressed="false">A · Ponerte detrás de Goku y pelear<small>Te quedas. Puede que aprendas algo… o que no salgas vivo.</small></button>
      <button type="button" id="optB" aria-pressed="false">B · Huir y buscar las Esferas del Dragón<small>Sobrevives hoy. Pero vas solo por el páramo.</small></button>
      <p class="voted" id="voted" hidden></p>
    </div>
    <div class="bar"><div id="timer"></div></div>
    <div class="controls">
      <button id="prev" type="button">Anterior</button>
      <button id="play" type="button" class="primary">Pausa</button>
      <button id="next" type="button">Siguiente</button>
      <div class="dots" id="dots"></div>
    </div>
  </aside>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
  const num = n => Math.round(n).toLocaleString("es-ES");

  const scenes = [
    { mode: "wake", tag: "DÍA 1", title: "Despiertas",
      text: "Abres los ojos en un <b>páramo rojo</b>, entre mesetas de roca. No tienes mochila, ni cápsulas, ni zeni. Solo la ropa que llevas puesta. El aire huele a polvo y a tormenta." },
    { mode: "fall", tag: "DÍA 1 · 17:42", title: "Algo cae del cielo",
      text: "Un punto brillante cruza el atardecer y se estrella a cien metros de ti. El suelo tiembla. Cuando el polvo baja, en el fondo del cráter hay <b>una cápsula redonda</b>. Todavía echa humo." },
    { mode: "goku", tag: "DÍA 1 · 17:43", title: "Llega Goku",
      text: "Antes de que puedas moverte, una <b>nube amarilla</b> baja en picado y se para delante del cráter. Encima, un chico con el pelo en punta y un traje naranja. Te mira y sonríe como si fuerais amigos de toda la vida." },
    { mode: "scan", tag: "DÍA 1 · 17:44", title: "Se abre la cápsula",
      text: "Goku te lanza un <b>rastreador</b>: «Póntelo». La pantalla verde marca tu poder de pelea: <b>5</b>. Entonces la cápsula se abre, aparecen dos ojos rojos y el número empieza a subir. Y sigue subiendo." },
    { mode: "vote", tag: "VOTACIÓN", title: "Tienes 23 segundos",
      text: "Goku se pone delante de ti: «Esto se va a poner feo». El rastreador pita sin parar. <b>Tú decides qué hace tu personaje.</b> El voto ganador será la Parte 2." },
  ];

  // ---------- decorado ----------
  for (let i = 0; i < 40; i++) el("circle", { cx: (i * 97) % 800, cy: (i * 53) % 150, r: (i % 3) * 0.6 + 0.6, fill: "#fff4e6", opacity: .5 }, $("stars"));
  [[60, 420, 26], [180, 440, 16], [300, 410, 12], [420, 450, 20], [720, 430, 24], [770, 400, 12]].forEach(([x, y, r]) =>
    el("ellipse", { cx: x, cy: y, rx: r, ry: r * 0.55, fill: "#5e3328" }, $("rocks")));
  const dust = [];
  for (let i = 0; i < 26; i++) dust.push({ n: el("circle", { r: 6 + (i % 4) * 3, fill: "#d79a6a" }, $("dust")), a: (i / 26) * Math.PI, s: 60 + (i % 5) * 25 });

  const bubble = (on, x, y, l1, l2) => {
    $("bubble").setAttribute("opacity", on ? 1 : 0);
    if (!on) return;
    $("bubble").setAttribute("transform", `translate(${x} ${y})`);
    $("bubbleText").textContent = l1; $("bubbleText2").textContent = l2 || "";
  };

  // ---------- navegación ----------
  let idx = 0, playing = !reduced, sceneT = 0, choice = null;
  const DUR = 10;
  scenes.forEach((s, i) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Escena " + (i + 1) + ": " + s.title);
    b.onclick = () => go(i); $("dots").appendChild(b);
  });
  function go(i) {
    idx = clamp(i, 0, scenes.length - 1); sceneT = 0;
    const s = scenes[idx];
    $("eyebrow").textContent = "Parte 1 · Escena " + (idx + 1) + " de " + scenes.length;
    $("title").textContent = s.title; $("text").innerHTML = s.text; $("tagText").textContent = s.tag;
    $("tag").querySelector("rect").setAttribute("width", s.tag.length * 9 + 30);
    $("tag").querySelector("rect").setAttribute("x", 400 - (s.tag.length * 9 + 30) / 2);
    [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === idx));
    $("vote").hidden = s.mode !== "vote";
    $("otherChip").hidden = !(s.mode === "scan" || s.mode === "vote" || s.mode === "goku");
    $("otherChip").classList.toggle("hot", s.mode !== "goku");
    $("otherLbl").textContent = s.mode === "goku" ? "Goku" : "La cápsula";
    $("headline").style.display = s.mode === "wake" ? "" : "none";
    $("prev").disabled = idx === 0; $("next").disabled = idx === scenes.length - 1;
  }
  $("prev").onclick = () => go(idx - 1);
  $("next").onclick = () => go(idx + 1);
  const setPlay = p => { playing = p; $("play").textContent = playing ? "Pausa" : "Reproducir"; };
  $("play").onclick = () => { if (idx === scenes.length - 1 && !playing) go(0); setPlay(!playing); };
  setPlay(playing);
  const pick = (c) => {
    choice = c;
    $("optA").setAttribute("aria-pressed", c === "A"); $("optB").setAttribute("aria-pressed", c === "B");
    $("voted").hidden = false;
    $("voted").textContent = "Tu voto: " + (c === "A" ? "PELEAR" : "HUIR") + ". Escríbemelo y hago la Parte 2 con esa decisión.";
  };
  $("optA").onclick = () => pick("A"); $("optB").onclick = () => pick("B");
  addEventListener("keydown", e => { if (e.key === "ArrowRight") go(idx + 1); if (e.key === "ArrowLeft") go(idx - 1); if (e.key === " " && e.target === document.body) { e.preventDefault(); $("play").click(); } });
  let tx = null;
  $("stage").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
  $("stage").addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); tx = null; });

  // ---------- animación ----------
  const speed = reduced ? 0.4 : 1;
  let last = performance.now(), clock = 0;
  const YOU_X = 250, GROUND = 400, CRATER_X = 560;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt * speed;
    const mode = scenes[idx].mode;
    const voteLen = 23;
    sceneT += dt * (mode === "vote" ? 1 : speed);
    const len = mode === "vote" ? voteLen : DUR;
    if (playing && sceneT > len && idx < scenes.length - 1) go(idx + 1);
    if (playing && mode === "vote" && sceneT > len) setPlay(false);
    $("timer").style.width = Math.min(100, sceneT / len * 100) + "%";
    const t = sceneT * (mode === "vote" ? 1 : speed);

    let shake = 0;
    // TÚ: tumbado → de pie
    const stand = mode === "wake" ? ease((t - 2.5) / 1.5) : 1;
    const youX = mode === "vote" ? YOU_X - 40 * ease(t / 2) : YOU_X;
    const breathe = Math.sin(clock * 2) * 1.2;
    $("you").setAttribute("transform", `translate(${youX} ${GROUND + (1 - stand) * -10})`);
    $("youBody").setAttribute("transform", `rotate(${(1 - stand) * -88}) translate(0 ${breathe * stand})`);
    $("youEyes").setAttribute("transform", `scale(1 ${mode === "wake" && t < 1.6 ? 0.15 : (Math.sin(clock * 1.3) > 0.97 ? 0.15 : 1)})`);
    $("youEyes").style.transformOrigin = "0 -89px";
    $("youMouth").setAttribute("d", mode === "scan" || mode === "vote" ? "M -5 -77 Q 0 -83 5 -77" : mode === "fall" && t > 1.4 ? "M -4 -79 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0" : "M -5 -79 Q 0 -76 5 -79");
    $("youLabel").setAttribute("opacity", stand);

    // meteoro + cráter
    let craterOn = mode !== "wake" ? 1 : 0;
    if (mode === "fall") {
      const f = clamp(t / 1.4);
      const sx = 820, sy = -40, ex = CRATER_X, ey = 370;
      const hx = sx + (ex - sx) * f, hy = sy + (ey - sy) * f * f;
      $("meteor").setAttribute("opacity", f < 1 ? 1 : 0);
      $("head").setAttribute("cx", hx); $("head").setAttribute("cy", hy);
      $("trail").setAttribute("x1", hx + 90); $("trail").setAttribute("y1", hy - 120 * f);
      $("trail").setAttribute("x2", hx); $("trail").setAttribute("y2", hy);
      craterOn = f >= 1 ? 1 : 0;
      const after = t - 1.4;
      if (after > 0 && after < 0.9) shake = (0.9 - after) * 14;
      dust.forEach(d => {
        const k = clamp(after / 2.5);
        d.n.setAttribute("cx", CRATER_X + Math.cos(d.a) * d.s * k * 1.6);
        d.n.setAttribute("cy", 385 - Math.sin(d.a) * d.s * k);
        d.n.setAttribute("opacity", after > 0 ? (1 - k) * 0.8 : 0);
      });
    } else {
      $("meteor").setAttribute("opacity", 0);
      dust.forEach(d => d.n.setAttribute("opacity", 0));
    }
    $("crater").setAttribute("opacity", craterOn);

    // Goku
    let gx = 455, gy = GROUND, gOn = mode === "goku" || mode === "scan" || mode === "vote" ? 1 : 0;
    if (mode === "goku") {
      const a = ease(t / 2.2);
      gx = -80 + (455 + 80) * a; gy = 120 + (GROUND - 120) * a - Math.sin(a * Math.PI) * 60;
    }
    if (mode === "vote") gx = 455 + 15 * ease(t / 2);
    const hover = mode === "goku" && t < 2.4 ? Math.sin(clock * 5) * 3 : 0;
    $("goku").setAttribute("opacity", gOn);
    $("goku").setAttribute("transform", `translate(${gx} ${gy + hover}) scale(-1 1)`);
    $("gLabel").setAttribute("transform", "scale(-1 1)");
    $("cloud").setAttribute("opacity", mode === "goku" ? 1 - ease((t - 3) / 1) : 0);
    $("gAura").setAttribute("opacity", mode === "vote" ? 0.7 + Math.sin(clock * 9) * 0.25 : 0);
    $("gAura").setAttribute("transform", `scale(${1 + Math.sin(clock * 9) * 0.04})`);
    $("gArmL").setAttribute("transform", mode === "goku" && t > 3.2 && t < 6 ? `rotate(${Math.sin(clock * 10) * 25 + 140} -25 -62)` : "");

    // bocadillos
    if (mode === "goku" && t > 3.4) bubble(true, 470, 230, "¡Hola! Soy Goku.", "¿Tú también viste eso caer?");
    else if (mode === "scan" && t < 3) bubble(true, 470, 230, "Toma, póntelo.", "Te dirá lo fuerte que eres.");
    else if (mode === "vote" && t > 1) bubble(true, 470, 230, "Quédate detrás de mí…", "o vete ahora. ¡Decide!");
    else bubble(false);

    // rastreador y cápsula
    $("scouter").setAttribute("opacity", mode === "scan" && t > 2 || mode === "vote" ? 1 : 0);
    let other = 0;
    const eyes = mode === "scan" ? clamp((t - 4.5) / 1) : mode === "vote" ? 1 : 0;
    $("podEyeL").setAttribute("opacity", eyes); $("podEyeR").setAttribute("opacity", eyes);
    $("podGlow").setAttribute("opacity", eyes * (0.6 + Math.sin(clock * 6) * 0.3));
    $("pod").setAttribute("transform", eyes ? `translate(${Math.sin(clock * 40) * 1.5 * eyes} 0)` : "");
    if (mode === "scan") {
      $("scouterHud").setAttribute("opacity", t > 2.2 ? 1 : 0);
      if (t < 4.5) { $("hudNum").textContent = "5"; $("hudNum").setAttribute("fill", "#5cff9d"); }
      else { other = 5 + Math.pow(clamp((t - 4.5) / 4.5), 2.2) * 1195; $("hudNum").textContent = num(other); $("hudNum").setAttribute("fill", other > 400 ? "#ff4d5e" : "#5cff9d"); }
    } else if (mode === "vote") {
      other = 1200 + Math.floor(t * 37) % 40; $("scouterHud").setAttribute("opacity", 0);
    } else $("scouterHud").setAttribute("opacity", 0);
    $("otherPow").textContent = mode === "goku" ? "???" : num(other);

    // contador de votación
    $("timerHud").setAttribute("opacity", mode === "vote" ? 1 : 0);
    if (mode === "vote") {
      const left = Math.max(0, Math.ceil(voteLen - t));
      $("clock").textContent = "0:" + String(left).padStart(2, "0");
      if (left < 6) shake = Math.max(shake, 1.5);
    }
    $("headline").setAttribute("opacity", mode === "wake" ? ease(t / 1.2) : 0);
    $("world").setAttribute("transform", shake ? `translate(${(Math.random() - .5) * shake} ${(Math.random() - .5) * shake})` : "");
    requestAnimationFrame(frame);
  }
  go(0);
  requestAnimationFrame(frame);
})();
</script>
